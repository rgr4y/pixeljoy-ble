[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixeljoy-ble"
version = "0.1.0"
description = "Reverse-engineered BLE protocol + client for PixelJoy LED matrix panels"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/rgr4y/pixeljoy-ble"
Issues = "https://github.com/rgr4y/pixeljoy-ble/issues"

[project.scripts]
pixeljoy = "pixeljoy.__main__:main"

[tool.setuptools]
packages = ["pixeljoy"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
pixeljoy = ["devices.json"]
