[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixeljoy-ble"
version = "0.1.0"
description = "Reverse-engineered BLE protocol + client for PixelJoy LED matrix panels"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
render = ["Pillow>=10"]
test = ["pytest"]

[project.scripts]
pixeljoy = "pixeljoy.__main__:main"

[tool.setuptools]
packages = ["pixeljoy"]

[tool.setuptools.package-data]
pixeljoy = ["devices.json"]
