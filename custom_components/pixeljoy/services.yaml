show_text:
  target:
    entity:
      integration: pixeljoy
      domain: light
  fields:
    text:
      required: true
      example: "HELLO"
      selector:
        text:
    color:
      default: [255, 255, 255]
      selector:
        color_rgb:
    speed:
      default: 50
      selector:
        number:
          min: 0
          max: 255
    rainbow:
      selector:
        number:
          min: 0
          max: 255

show_clock:
  target:
    entity:
      integration: pixeljoy
      domain: light
  fields:
    style:
      default: 1
      selector:
        number:
          min: 1
          max: 10
    hour_24:
      default: true
      selector:
        boolean:
    show_date:
      default: false
      selector:
        boolean:
    color:
      default: [255, 255, 255]
      selector:
        color_rgb:

show_image:
  target:
    entity:
      integration: pixeljoy
      domain: light
  fields:
    path:
      required: true
      example: "/config/www/pixel/cat.png"
      selector:
        text:
    fit:
      default: contain
      selector:
        select:
          options: [stretch, contain, cover]

show_gif:
  target:
    entity:
      integration: pixeljoy
      domain: light
  fields:
    path:
      required: true
      example: "/config/www/pixel/nyan.gif"
      selector:
        text:
    speed:
      default: 600
      selector:
        number:
          min: 0
          max: 1050

sync_time:
  target:
    entity:
      integration: pixeljoy
      domain: light
